<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
    <style>
        .border {
            fill: #3333;
            stroke: #eee8;
            stroke-width: .1rem;
        }
        .figure {
            fill: #eee8;
        }
    </style>
    <circle class="border" cx="50" cy="50" r="50"/>
    <circle class="border" cx="50" cy="50" r="45"/>
    <circle class="border" cx="50" cy="50" r="40"/>
    <rect class="figure border" x="30" y="70" width="40" height="5"/>
    <polygon class="border figure" points="30,70 20,30 40,45 50,15 60,45 80,30 70,70 "/>
</svg>